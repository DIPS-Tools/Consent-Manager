openapi: 3.0.0
info:
  title: Consent Manager API
  version: 1.0.0
  description: API documentation for the Consent Manager service.
servers:
  - url: http://localhost:8019

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/login:
    post:
      summary: User login
      description: Authenticate a user with email and password.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Enter your email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  description: Enter your password
                  example: secret123
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authentication
        "400":
          description: Email and password are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register:
    post:
      summary: User registration
      description: Create a new user account with role and type.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Full name of the user
                  example: Acme
                email:
                  type: string
                  description: Email address of the user
                  example: acme@example.com
                password:
                  type: string
                  format: password
                  description: Password for the account
                  example: acme123
                role:
                  type: string
                  description: |
                    System-level role.
                    - **owner** for data owner registration.
                    - **requester** for data consumer registration.
                  example: owner
                type:
                  type: string
                  description: |
                    User type (domain-specific role):
                    - **provider** for data owner registration.
                    - **consumer** for data consumer registration.
                  enum: [provider, consumer]
                  example: provider
              required:
                - name
                - email
                - password
                - role
                - type
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    description: Unique user ID
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [provider, consumer]
                  userData:
                    type: object
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/create:
    post:
      summary: Create an anonymous owner by email address
      description: Create an anonymous owner account.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address of the user
                  example: acme@example.com
                role:
                  type: string
                  description: |
                    System-level role.
                    - **owner** for data owner registration.
                  example: owner
              required:
                - email
                - role
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    description: Unique user ID
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [provider, consumer]
                  userData:
                    type: object
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/user/{uid}:
    get:
      summary: Get user data
      description: Get user data by MongoDB ObjectId.
      tags:
        - Authentication
      parameters:
      - name: uid
        in: path
        required: true
        description: The MongoDB ObjectId of the user.
        schema:
          type: string
          example: "6866c6ddd5b8974f1090781d"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    description: Unique user ID
                  role:
                    type: string
                    enum: [provider, consumer]
                  userData:
                    $ref: "#/components/schemas/UserData"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to get user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/owners:
    get:
      summary: Get all owners
      description: Get all owners' ids, email addresses and names.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owners retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  owners:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique user id
                        email:
                          type: string
                          format: email
                        name:
                          type: string
        "500":
          description: Failed to get owners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/update:
    post:
      summary: Update user data
      description: Update a user's data.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                new_password:
                  type: string
                confirm_password:
                  type: string
                name:
                  type: string
                role:
                  type: string
                
              
      responses:
        "200":
          description: Owners retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  owners:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique user id
                        email:
                          type: string
                          format: email
                        name:
                          type: string
        "500":
          description: Failed to get owners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/user/{email}:
    delete:
      summary: Delete a user
      description: Delete a user with a particular email address.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: path
          required: true
          description: The email address of the user.
          schema:
            type: string
            format: email
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  details:
                    type: object
        "400":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/auth/token/{token}:
    get:
      summary: Authenticate with token
      description: Authenticate with Keycloak API token
      tags:
        - Authentication
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: An API token.
          schema:
            type: string
      responses:
        "200":
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  details:
                    type: object
        "400":
          description: Token is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/verify/{token}:
    get:
      summary: Create an account for an unregistered user
      description: By clicking an email link, the user accepts the creation of an account, then logged in and redirected to a pending request.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: An API token.
          schema:
            type: string
      responses:
        '302':
          description: Redirects the user to the pending request details page.
          headers:
            Location:
              description: URL of the pending request details page.
              schema:
                type: string
                format: uri
              example: https://consent-manager/ownerBase/ownerPendingRequestsDetails/6866c6ddd5b8974f1090781d?auth_user=user@example.com&auth_token=abc123
        "400":
          description: Token is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Malformed token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Registration or token verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests:
    post:
      summary: Create a new request
      description: Allows a consumer to create a new data request.
      tags:
        - Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestData"
      responses:
        "201":
          description: Request created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the newly created request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Request created successfully"
        "400":
          description: No requester specified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
        "500":
          description: Error creating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests/{id}:
    get:
      summary: Get a specific request
      operationId: getRequestById
      tags:
        - Requests

      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"

      responses:
        "200":
          description: Request retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - data
                  - success
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  data:
                    $ref: "#/components/schemas/RequestData"
                  success:
                    type: boolean
                    example: true
    delete:
      summary: Update a request
      tags:
        - Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      responses:
        "200":
          description: Request updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Request deleted successfully"
        "500":
          description: Failed to delete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a request
      tags:
        - Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestData"
      responses:
        "200":
          description: Request updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Request updated successfully"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests/{id}/accept/{token}:
    get:
      summary: Accept a specific request through an email link.
      tags:
        - Requests

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
        - name: token
          in: path
          required: true
          description: An email token.
          schema:
            type: string
      
      responses:
        "200":
          description: Request updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
        "401":
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The user has already accepted or rejected this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests/{id}/accept:
