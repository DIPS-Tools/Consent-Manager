              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests/{id}/send:
    post:
      summary: Send a specific request to a list of email addresses
      operationId: sendRequest
      tags:
        - Requests

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required:
                    - user_details
                - required:
                    - ownersPending
              properties:
                ownersPending:
                  type: array
                  items:
                    type: string
                    format: ObjectId
                  example:
                    - "6866c6ddd5b8974f1090781d"

                user_details:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      id:
                        type: string
                    required:
                      - email
                  example:
                    - email: alice@example.com
                      name: Alice
                      id: "123"
                    - email: bob@example.com
                      name: Bob
                      id: "456"

      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      
      responses:
        "200":
          description: Request updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
        "401":
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The user has already accepted or rejected this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
                
  /api/requests/{requestId}/contract:
    get:
      tags:
        - Requests
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      responses:
        "200":
          description: Request rejected successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
                
  /api/requests/{requestId}/createContract:
    post:
      summary: Create a contract
      tags:
        - Requests
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  $ref: "#/components/schemas/ODRLPolicy"
      responses:
        "200":
          description: Request rejected successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
        "401":
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The user has already rejected this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  
  /api/requests/{requestId}/GetContract/{contractId}:
    get:
      tags:
        - Requests
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
        - name: contractId
          in: path
          required: true
          description: The MongoDB ObjectId of the contract.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
      responses:
        "200":
          description: Request rejected successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
        "404":
          description: Request or contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch contract details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Refinement:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: "region"
        value:
          type: string
          example: "EU"

    Permission:
      type: object
      required:
        - dataset
        - action
        - purpose
        - datasetRefinements
        - purposeRefinements
        - actionRefinements
        - constraintRefinements
      properties:
        dataset:
          type: string
          example: "patient-records"
        action:
          type: string
          example: "read"
        purpose:
          type: string
          example: "research"
        datasetRefinements:
          type: array
          items:
            $ref: "#/components/schemas/Refinement"
        purposeRefinements:
          type: array
          items:
            $ref: "#/components/schemas/Refinement"
        actionRefinements:
          type: array
          items:
            $ref: "#/components/schemas/Refinement"
        constraintRefinements:
          type: array
          items:
            $ref: "#/components/schemas/Refinement"

    SelectedOntology:
      type: object
      required:
        - _id
        - name
      properties:
        _id:
          type: string
          example: "6845c1234b8974f109012345"
        name:
          type: string
          example: "ODRL"

    Requester:
      type: object
      required:
        - requesterId
        - requesterName
        - requesterEmail
      properties:
        requesterId:
          type: string
          example: "user-123"
        requesterName:
          type: string
          example: "John Doe"
        requesterEmail:
          type: string
          format: email
          example: "john.doe@example.com"

    RequestData:
      type: object
      required:
        - requestName
        - permissions
        - selectedOntologies
        - owners
        - ownersPending
        - ownersAccepted
        - ownersRejected
      properties:
        requestName:
          type: string
          example: "Cancer Research Dataset Access"

        description:
          type: string
          example: "Requesting access for a clinical study."

        extraTerms:
          type: string
          example: "Data must not be redistributed."

        extraText:
          type: string
          example: "Additional information for reviewers."

        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

        selectedOntologies:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOntology"

        requester:
          $ref: "#/components/schemas/Requester"

        policy:
          type: object
          additionalProperties: true
          description: ODRL policy JSON.

        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata such as audit request identifiers.

        owners:
          type: array
          items:
            type: string
        
        ownersPending:
          type: array
          items:
            type: string

        ownersAccepted:
          type: array
          items:
            type: string

        ownersRejected:
          type: array
          items:
            type: string
    ODRLPolicy:
      type: object
      required:
        - "@context"
        - "@type"
      properties:
        "@context":
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
          example: "http://www.w3.org/ns/odrl.jsonld"

        "@id":
          type: string
          format: uri
          example: "https://example.org/policy/123"

        "@type":
          type: string
          enum:
            - Set
            - Offer
            - Agreement
            - Privacy
            - Request
          example: "Agreement"

        uid:
          type: string
          format: uri

        profile:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

        permission:
          type: array
          items:
            $ref: "#/components/schemas/ODRLRule"

        prohibition:
          type: array
          items:
            $ref: "#/components/schemas/ODRLRule"

        obligation:
          type: array
          items:
            $ref: "#/components/schemas/ODRLRule"

      additionalProperties: true

    ODRLRule:
      type: object
      required:
        - action
      properties:
        target:
          type: string

        assigner:
          oneOf:
            - type: string
            - type: object

        assignee:
          oneOf:
            - type: string
            - type: object

        action:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object

        constraint:
          type: array
          items:
            $ref: "#/components/schemas/ODRLConstraint"

      additionalProperties: true

    ODRLConstraint:
      type: object
      properties:
        leftOperand:
          type: string

        operator:
          type: string

        rightOperand:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: object
            - type: object

        rightOperandReference:
          type: string

    UserData:
      type: object
      required:
        - _id
        - name
      properties:
        _id:
          type: string
          description: The MongoDB ObjectId of the user.
          example: "6866c6ddd5b8974f1090781d"
        keycloak_sub:
          type: string
          description: The Keycloak subject of the user
          example: "a2b59ea1-51a8-4d82-9ee2-30c21323f9e3"
        first_name:
          type: string
          description: User's first name
          example: Reginald
        last_name:
          type: string
          description: User's last name
          example: Smith
        username:
          type: string
          description: Username
          example: consent_manager_user
        type:
          type: string
          enum: [provider, consumer]
        email:
          type: string
          format: email
          description: User's email address
          example: consent_user@example.com
        organization:
          type: array
          items:
            type: string
        incorporation:
          type: string
        address:
          type: string
        vat_no:
          type: string
        position_title:
          type: string
        phone:
          type: string
        
    ErrorResponse:
      type: object
      required:
        - error
        - success
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Requester information is required"
        success:
          type: boolean
          example: false
