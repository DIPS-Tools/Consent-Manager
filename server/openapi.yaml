          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/requests/{id}/reject/{token}:
    get:
      summary: Reject a specific request through an email link.
      tags:
        - Requests

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: The MongoDB ObjectId of the request.
          schema:
            type: string
            example: "6866c6ddd5b8974f1090781d"
        - name: token
          in: path
          required: true
          description: An email token.
          schema:
            type: string
      
      responses:
        "200":
          description: Request updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - success
                  - message
                properties:
                  id:
                    type: string
                    description: The MongoDB ObjectId of the request.
                    example: "6866c6ddd5b8974f1090781d"
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    description: Success message
                    example: "Request updated successfully"
        "401":
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The user has already accepted or rejected this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error updating request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  
  /api/requests/{id}/reject:
    post:
      summary: Reject a specific request by ID
      tags:
